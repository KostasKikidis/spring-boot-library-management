<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* GENERAL PAGE */
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
        }

        /* HEADER TITLE */
        .init_title {
            text-align: center;
            font-size: 36px;
            margin-top: 20px;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        /* WELCOME TEXT */
        p {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        /* TABLE STYLE */
        .displayallbook {
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        /* TABLE HEADER */
        .displayallbook th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: center;
        }

        /* TABLE CELLS */
        .displayallbook td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        /* ROW HOVER EFFECT */
        .displayallbook tr:hover {
            background-color: #f1f1f1;
        }

        /* HEADER SECTION SPACING */
        h1,
        p {
            margin-bottom: 10px;
        }

        /* ===== FORMS CONTAINER ===== */
        .add_delete_update {
            display: flex;
            justify-content: space-between;
            align-items: stretch; /* Όλα ίδια σε ύψος */
            gap: 20px;
            margin: 30px auto;
            width: 90%;
        }

        /* ===== PANELS ===== */
        .add_delete_update > div {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;

            flex: 1;
            min-height: 380px; /* Ίδιο ύψος για όλα */

            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        /* DELETE PANEL (μεσαίο) */
        .add_delete_update > div:nth-child(2) {
            flex: 0.6;
            max-width: 220px;
        }

        /* FORM */
        .add_delete_update form {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* INPUTS */
        .add_delete_update input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* BUTTONS */
        .add_delete_update button {
            width: 100%;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: auto;
        }

        .add_delete_update button:hover {
            background-color: #34495e;
        }

        /* FORM TITLES */
        .add_delete_update h2,
        .add_delete_update h3 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .moreoptions form {
            padding: 10px;
        }

        /* SEARCH BY PRICE PANEL */
        .search-price {
            display: flex;
            align-content: space-between;
            gap: 10px;
        }

        .search-price {
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .search-price h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .search-price form {
            display: flex;
            flex-direction: column;
        }

        .search-price input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .search-price button {
            width: 100%;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .search-price button:hover {
            background-color: #34495e;
        }

        .helpingButtons {
            display: flex;
            justify-content: space-around;
            align-content: center;
        }

        .available-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .available-btn:hover {
            background-color: #218838;
        }

        .all-btn {
            background-color: #007bff; /* Μπλε */
            color: white; /* Άσπρα γράμματα */
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .all-btn:hover {
            background-color: #0056b3; /* Πιο σκούρο μπλε στο hover */
        }

        .not-available-btn {
            background-color: #6b1f2b; /* Σκούρο μπορντό */
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .not-available-btn:hover {
            background-color: #4a131c;
        }
    </style>
    <title>Library Management</title>

</head>
<body>
<h1 class="init_title"><strong>Library Management</strong></h1>
<br>
<p> Welcome to my First Spring Boot Application</p>
<br>


<table class="displayallbook">
    <thead>
    <tr>
        <th scope="col">Id</th>
        <th scope="col">Title</th>
        <th scope="col">Author</th>
        <th scope="col">Price</th>
        <th scope="col">Available</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book:${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.price}"></td>
        <td th:text="${book.available}"></td>

    </tr>
    </tbody>

</table>
<div class="add_delete_update">
    <div>
        <form action="/addBook" method="post">
            <input type="text" name="title" placeholder="Title" required>
            <br><br>

            <input type="text" name="author" placeholder="Author" required>
            <br><br>

            <input type="number" step="0.01" name="price" placeholder="Price" required>
            <br><br>

            <label>
                Available:
                <input type="checkbox" name="available">
            </label>

            <br><br>

            <button type="submit">Add Book</button>
        </form>
    </div>
    <div class="moreoptions">
        <form action="/getBookById" method="get">

            <input type="number" name="id" step="1" placeholder="Enter Book ID" required>

            <button type="submit">Get Book</button>

        </form>
        <form action="/deleteBook" method="post">

            <input type="number" name="id" step="1" placeholder="Enter Book ID" required>

            <button type="submit">Delete Book</button>

        </form>

        <form action="/booksByAuthor" method="get">

            <input type="text" name="author" placeholder="Author" required>

            <button type="submit">Search</button>

        </form>

        <form action="/booksByTitle" method="get">

            <input type="text" name="title" placeholder="Title" required>

            <button type="submit">Search</button>

        </form>
    </div>
    <div>
        <form action="/updateBook" method="post">
            <input type="number" name="id" placeholder="Enter Book ID" required>
            <br><br>
            <input type="text" name="title" placeholder="Title" required>
            <br><br>

            <input type="text" name="author" placeholder="Author" required>
            <br><br>

            <input type="number" step="0.01" name="price" placeholder="Price" required>
            <br><br>

            <label>
                Available:
                <input type="checkbox" name="available">
            </label>

            <br><br>

            <button type="submit">Update Book</button>
        </form>
    </div>
</div>
<div class="search-price">
    <form action="/greaterThanPrice" method="get">
        <input type="number" step="0.01" name="price" placeholder="Price" required>
        <br><br>
        <button type="submit">Expensive Books</button>
    </form>
    <form action="/lessThanPrice" method="get">
        <input type="number" step="0.01" name="price" placeholder="Price" required>
        <br><br>
        <button type="submit"> Cheaper Books</button>
    </form>
</div>
<div class="helpingButtons">
    <form action="/availableBooks" class="available-btn" method="get">
        <button type="submit">
            Available Books
        </button>
    </form>
    <form action="/getAllBooks" class="all-btn" method="get">
        <button type="submit">
            All Books
        </button>
    </form>
    <form action="/notAvailableBooks" class="not-available-btn" method="get">
        <button type="submit">
            Not Available Books
        </button>
    </form>
</div>


</body>
</html>
